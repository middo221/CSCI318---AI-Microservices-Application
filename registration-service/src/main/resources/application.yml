server:
  port: 8082

spring:
  application:
    name: registration-service
  datasource:
    url: jdbc:h2:mem:regdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    function:
      definition: eventPublished
    stream:
      bindings:
        eventPublished-in-0:
          destination: event-published
          group: registration-service
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    au.edu.uow.csci318.conference: DEBUG
