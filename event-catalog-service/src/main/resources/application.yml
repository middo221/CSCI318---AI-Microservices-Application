server:
  port: 8081

spring:
  application:
    name: event-catalog-service
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          # The binder defaults key.serializer to ByteArraySerializer, but DomainEvent.partitionKey()
          # is a String, so every send fails with a SerializationException. Serialising keys as
          # strings also keeps them readable in Kafka UI, which the demonstration depends on.
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    au.edu.uow.csci318.conference: DEBUG
