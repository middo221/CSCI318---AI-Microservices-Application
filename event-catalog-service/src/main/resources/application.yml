server:
  port: 8081

spring:
  application:
    name: event-catalog-service
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    au.edu.uow.csci318.conference: DEBUG
