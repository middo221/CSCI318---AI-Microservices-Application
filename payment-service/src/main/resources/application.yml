server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
    cloud:
    function:
      definition: registrationRequested
    stream:
      bindings:
        registrationRequested-in-0:
          destination: registration-requested
          group: payment-service

logging:
  level:
    au.edu.uow.csci318.conference: DEBUG
