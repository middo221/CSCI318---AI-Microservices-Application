<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="791px" preserveAspectRatio="none" style="width:914px;height:791px;background:#FFFFFF;" version="1.1" viewBox="0 0 914 791" width="914px" zoomAndPan="magnify"><title>FR-18 &#8212; The requestRefund tool</title><defs/><g><text fill="#000000" font-family="Arial" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="248.8984" x="331.4149" y="35.0078">FR-18 &#8212; The requestRefund tool</text><ellipse cx="217.3132" cy="59.3984" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="279.2466" x="77.6899" y="89.3984"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="259.2466" x="87.6899" y="109.7163">the model calls requestRefund(registrationId, reason)</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="149.0298" x="142.7983" y="142.0474"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="129.0298" x="152.7983" y="162.3652">ownership guard as above</text><polygon fill="#FFF8DC" points="126.8616,194.6963,307.7649,194.6963,319.7649,206.6963,307.7649,218.6963,126.8616,218.6963,114.8616,206.6963,126.8616,194.6963" style="stroke:#B8A04A;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="171.2109" x="126.8616" y="204.5771">already requested in this conversation,</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="180.9033" x="126.8616" y="216.0762">or an earlier refund's outcome unknown?</text><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.5615" x="99.3" y="204.5771">yes</text><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="11.123" x="319.7649" y="204.5771">no</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="56.6899" x="11" y="228.6963"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="36.6899" x="21" y="249.0142">refused</text><rect fill="#FFFFFF" height="45.2979" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="211.979" x="293.6102" y="228.6963"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="191.979" x="303.6102" y="249.0142">fetch a fresh quote &#8212; payment-service:</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="154.6929" x="303.6102" y="261.6631">GET /api/v1/refund-policy/quote</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="259.7119" x="269.7438" y="293.9941"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="239.7119" x="279.7438" y="314.312">RefundGuard.evaluate(quote, already requested)</text><polygon fill="#FFF8DC" points="313.9918,346.6431,485.2076,346.6431,497.2076,369.6411,485.2076,392.6392,313.9918,392.6392,301.9918,369.6411,313.9918,346.6431" style="stroke:#B8A04A;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="114.5068" x="313.9918" y="356.0229">ineligible, zero, more than</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="130.6299" x="319.5485" y="367.522">paid, another currency, or the</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="165.6592" x="319.5485" y="379.021">conversation total above 200.00 AUD</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="147.3047" x="319.5485" y="390.52">(refund-auto-approve-threshold)?</text><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.5615" x="286.4303" y="367.522">yes</text><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="11.123" x="497.2076" y="367.522">no</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="192.2778" x="93.3717" y="402.6392"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="172.2778" x="103.3717" y="422.957">refused: "call escalateToOrganiser"</text><rect fill="#FFFFFF" height="70.5957" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="170.4067" x="524.4855" y="402.6392"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="95.9761" x="534.4855" y="422.957">registration-service:</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="150.4067" x="534.4855" y="435.606">POST /api/v1/registrations/{id}/</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="120.4629" x="534.4855" y="448.2549">refund-requests {reason,</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="147.3291" x="534.4855" y="460.9038">requestedBy AGENT} (FR-11)</text><polygon fill="#FFF8DC" points="358.2067,493.2349,396.0045,493.2349,408.0045,505.2349,396.0045,517.2349,358.2067,517.2349,346.2067,505.2349,358.2067,493.2349" style="stroke:#B8A04A;stroke-width:0.5;"/><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="16.6846" x="381.1056" y="526.6147">202</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="37.7979" x="358.2067" y="508.8652">answer?</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="142.9121" x="305.6495" y="548.7339"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="122.9121" x="315.6495" y="569.0518">record RequestedRefund</text><polygon fill="#FFF8DC" points="571.1207,493.2349,595.1207,493.2349,607.1207,505.2349,595.1207,517.2349,571.1207,517.2349,559.1207,505.2349,571.1207,493.2349" style="stroke:#B8A04A;stroke-width:0.5;"/><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.5615" x="587.1207" y="526.6147">yes</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="15.5615" x="575.34" y="508.8652">4xx</text><text fill="#3B3B3B" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="46.1377" x="607.1207" y="503.1157">no answer</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="229.1182" x="468.5616" y="548.7339"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="209.1182" x="478.5616" y="569.0518">explain the refusal (e.g. 409 not confirmed)</text><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="196.0483" x="707.6798" y="545.9844"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="176.0483" x="717.6798" y="566.3022">outcome UNKNOWN &#8212; do not retry</text><polygon fill="#FFF8DC" points="399.5997,607.3828,411.5997,619.3828,399.5997,631.3828,387.5997,619.3828,399.5997,607.3828" style="stroke:#B8A04A;stroke-width:0.5;"/><polygon fill="#FFF8DC" points="217.3132,637.3828,229.3132,649.3828,217.3132,661.3828,205.3132,649.3828,217.3132,637.3828" style="stroke:#B8A04A;stroke-width:0.5;"/><rect fill="#FFFFFF" height="32.6489" rx="4" ry="4" style="stroke:#555555;stroke-width:0.5;" width="183.8667" x="125.3799" y="681.3828"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="163.8667" x="135.3799" y="701.7007">the result is returned to the model</text><path d="M248.3132,724.0317 L248.3132,742.2803 L228.3132,746.2803 L248.3132,750.2803 L248.3132,768.5288 A0,0 0 0 0 248.3132,768.5288 L469.1228,768.5288 A0,0 0 0 0 469.1228,768.5288 L469.1228,734.0317 L459.1228,724.0317 L248.3132,724.0317 A0,0 0 0 0 248.3132,724.0317 " fill="#FFF8DC" style="stroke:#B8A04A;stroke-width:0.5;"/><path d="M459.1228,724.0317 L459.1228,734.0317 L469.1228,734.0317 L459.1228,724.0317 " fill="#FFF8DC" style="stroke:#B8A04A;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="159.5166" x="254.3132" y="738.4116">The refund limit is code, not prompt:</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="181.7871" x="254.3132" y="749.9106">requestRefund fetches its own quote and</text><text fill="#000000" font-family="Arial" font-size="10" lengthAdjust="spacing" textLength="199.8096" x="254.3132" y="761.4097">RefundGuard judges the conversation's total.</text><ellipse cx="217.3132" cy="746.2803" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="217.3132" cy="746.2803" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#3B3B3B;stroke-width:1.0;" x1="217.3132" x2="217.3132" y1="69.3984" y2="89.3984"/><polygon fill="#3B3B3B" points="213.3132,79.3984,217.3132,89.3984,221.3132,79.3984,217.3132,83.3984" style="stroke:#3B3B3B;stroke-width:1.0;"/><line style="stroke:#3B3B3B;stroke-width:1.0;" x1="217.3132" x2="217.3132" y1="122.0474" y2="142.0474"/><polygon fill="#3B3B3B" points="213.3132,132.0474,217.3132,142.0474,221.3132,132.0474,217.3132,136.0474" style="stroke:#3B3B3B;stroke-width:1.0;"/><line style="stroke:#3B3B3B;stroke-width:1.0;" x1="399.5997" x2="399.5997" y1="273.9941" y2="293.9941"/><polygon fill="#3B3B3B" points="395.5997,283.9941,399.5997,293.9941,403.5997,283.9941,399.5997,287.9941" style="stroke:#3B3B3B;stroke-width:1.0;"/><line style="stroke:#3B3B3B;stroke-width:1.0;" x1="377.1056" x2="377.1056" y1="51