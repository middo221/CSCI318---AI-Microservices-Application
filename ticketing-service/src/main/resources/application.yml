server:
  port: 8084

spring:
  application:
    name: ticketing-service
  datasource:
    url: jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    au.edu.uow.csci318.conference: DEBUG
